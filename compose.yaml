services:
  app:
    image: pod-tracker-web:production
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - ${POD_TRACKER_COMPOSE_ENV_FILE:-.env}
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
      POD_TRACKER_DATABASE_URL: ${POD_TRACKER_DATABASE_URL:-postgres://pod_tracker:pod_tracker@postgres:5432/pod_tracker?sslmode=disable}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/readyz | grep -q '\"ok\":true'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8083}:3000"
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pod_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-pod_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pod_tracker}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-55432}:5432"
    restart: unless-stopped
    volumes:
      - pod_tracker_postgres:/var/lib/postgresql

  valkey:
    image: valkey/valkey:9-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${VALKEY_BIND:-127.0.0.1}:${VALKEY_PORT:-6379}:6379"
    restart: unless-stopped
    volumes:
      - pod_tracker_valkey:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["optional"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pod_tracker
      MINIO_ROOT_PASSWORD: pod_tracker_dev_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - pod_tracker_minio:/data

  umami-postgres:
    image: postgres:18-alpine
    profiles: ["analytics"]
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - pod_tracker_umami_postgres:/var/lib/postgresql

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    profiles: ["analytics"]
    depends_on:
      - umami-postgres
    environment:
      DATABASE_URL: postgres://umami:umami@umami-postgres:5432/umami
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-pod_tracker_dev_only_change_me}
    ports:
      - "3001:3000"

  glitchtip-postgres:
    image: postgres:18-alpine
    profiles: ["errors"]
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
    volumes:
      - pod_tracker_glitchtip_postgres:/var/lib/postgresql

  glitchtip:
    image: glitchtip/glitchtip:v4.0
    profiles: ["errors"]
    depends_on:
      - glitchtip-postgres
      - valkey
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-pod_tracker_dev_only_change_me}
      EMAIL_URL: consolemail://
      DEFAULT_FROM_EMAIL: glitchtip.local@example.invalid
      GLITCHTIP_DOMAIN: http://localhost:8000
      GLITCHTIP_EMBED_WORKER: "true"
      VALKEY_URL: redis://valkey:6379/0
      ENABLE_USER_REGISTRATION: "true"
    ports:
      - "8000:8000"

volumes:
  pod_tracker_postgres:
  pod_tracker_valkey:
  pod_tracker_minio:
  pod_tracker_umami_postgres:
  pod_tracker_glitchtip_postgres:
